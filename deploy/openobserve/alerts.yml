# OpenObserve alerts, applied by scripts/nas-setup.sh (deployer/tools/openobserve_alerts.py).
# Every query reads the traces stream "default" across all apps, so a newly traced app is covered
# without changes here. Times are in minutes. An alert fires when its query returns at least
# `threshold` rows, and each row becomes one line of the ntfy message (row_template).
# Names must be lowercase words joined by '-' (OpenObserve rejects spaces and symbols).
# Messages go to the public ntfy.sh topic: never select bodies, headers or other user data.
alerts:
  - name: server-errors-5xx
    description: Any 5xx response in the last 5 minutes.
    sql: >-
      SELECT service_name, COALESCE(http_route, 'unrouted') AS route, count(*) AS errors
      FROM "default"
      WHERE span_kind = '2' AND CAST(http_status_code AS INT) >= 500
      GROUP BY service_name, route
    period: 5
    frequency: 1
    operator: ">="
    threshold: 1
    silence: 30
    row_template: "{service_name} {route}: {errors} errors"

  - name: slow-requests
    description: A route with at least 5 requests in 15 minutes and a p95 above 1 second.
    sql: >-
      SELECT service_name, COALESCE(http_route, 'unrouted') AS route, count(*) AS requests,
      CAST(approx_percentile_cont(duration, 0.95) / 1000 AS BIGINT) AS p95_ms
      FROM "default"
      WHERE span_kind = '2'
      GROUP BY service_name, route
      HAVING count(*) >= 5 AND approx_percentile_cont(duration, 0.95) > 1000000
    period: 15
    frequency: 5
    operator: ">="
    threshold: 1
    silence: 60
    row_template: "{service_name} {route}: p95 {p95_ms} ms over {requests} requests"

  - name: many-401-403
    description: 20 or more 401/403 responses on one route in 5 minutes (password guessing or key abuse).
    sql: >-
      SELECT service_name, COALESCE(http_route, 'unrouted') AS route, count(*) AS denied
      FROM "default"
      WHERE span_kind = '2' AND CAST(http_status_code AS INT) IN (401, 403)
      GROUP BY service_name, route
      HAVING count(*) >= 20
    period: 5
    frequency: 1
    operator: ">="
    threshold: 1
    silence: 30
    row_template: "{service_name} {route}: {denied} denied"

  # Quotes are stripped from the SQL so the ntfy message stays readable.
  - name: n-plus-one-queries
    description: One request ran the same SQL statement 10 or more times in the last hour.
    sql: >-
      SELECT r.service_name AS service_name, COALESCE(r.http_route, 'unrouted') AS route,
      q.query_norm AS query_norm, max(q.repeats) AS repeats
      FROM (
        SELECT trace_id, o2_db_fingerprint, replace(max(o2_db_query_norm), '"', '') AS query_norm, count(*) AS repeats
        FROM "default"
        WHERE span_kind = '3'
        GROUP BY trace_id, o2_db_fingerprint
        HAVING count(*) >= 10
      ) q
      JOIN (SELECT trace_id, service_name, http_route FROM "default" WHERE span_kind = '2') r
      ON q.trace_id = r.trace_id
      GROUP BY service_name, route, query_norm
    period: 60
    frequency: 60
    operator: ">="
    threshold: 1
    silence: 1440
    row_template: "{service_name} {route}: {repeats}x {query_norm}"

  # The health check's database queries are the heartbeat: they reach OpenObserve every 30 s
  # even with no user traffic, so silence means the API or its tracing is down.
  - name: service-silent
    description: An app that sent spans in the last hour sent none in the last 15 minutes.
    sql: >-
      SELECT service_name,
      CAST((CAST(to_unixtime(now()) AS BIGINT) * 1000000 - max(_timestamp)) / 60000000 AS BIGINT) AS minutes
      FROM "default"
      GROUP BY service_name
      HAVING max(_timestamp) < (CAST(to_unixtime(now()) AS BIGINT) - 900) * 1000000
    period: 60
    frequency: 5
    operator: ">="
    threshold: 1
    silence: 60
    row_template: "{service_name}: no spans for {minutes} min"
