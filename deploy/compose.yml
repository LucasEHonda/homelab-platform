name: platform

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  deployer:
    image: ghcr.io/lucasehonda/homelab-deployer:${DEPLOYER_VERSION:?set DEPLOYER_VERSION in deploy/.env}
    env_file: ../.envs/.deployer
    environment:
      DEPLOYER_CONFIG: /config/apps.yml
      DEPLOYER_HISTORY: /data/deployments.jsonl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The deployer's own ghcr.io login (read:packages only), written by scripts/nas-setup.sh.
      - ../.envs/docker-config.json:/root/.docker/config.json:ro
      - ./apps.yml:/config/apps.yml:ro
      - ../data/deployer:/data
      - /mnt/svd/games:/mnt/svd/games
      - /mnt/svd/pinguei:/mnt/svd/pinguei
      - /mnt/svd/financas:/mnt/svd/financas
    networks: [platform, egress]
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m

  deployer-tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.102.4}
    # No container hostname: "deployer" must resolve to the deployer service, which serve.json proxies to.
    env_file: ../.envs/.tailscale-deployer
    environment:
      TS_HOSTNAME: deployer
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
    volumes:
      - ../data/tailscale-deployer:/var/lib/tailscale
      - ./tailscale/deployer-serve.json:/config/serve.json:ro
    networks: [platform, egress]
    depends_on: [deployer]
    restart: unless-stopped
    logging: *logging

  infisical:
    image: infisical/infisical:${INFISICAL_VERSION:-v0.166.3}
    env_file: ../.envs/.infisical
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    networks: [platform]
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g

  infisical-db:
    image: postgres:16
    user: "568:568"
    env_file: ../.envs/.infisical-db
    volumes:
      - ../data/infisical-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    restart: unless-stopped
    logging: *logging

  infisical-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [platform]
    restart: unless-stopped
    logging: *logging

  secrets-tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.102.4}
    hostname: secrets
    env_file: ../.envs/.tailscale-secrets
    environment:
      TS_HOSTNAME: secrets
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
    volumes:
      - ../data/tailscale-secrets:/var/lib/tailscale
      - ./tailscale/secrets-serve.json:/config/serve.json:ro
    networks: [platform, egress]
    depends_on: [infisical]
    restart: unless-stopped
    logging: *logging

  data-postgres:
    image: postgres:16
    user: "568:568"
    env_file: ../.envs/.data-postgres
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    volumes:
      - ../data/data-postgres:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1g

  data-redis:
    image: redis:7.4-alpine
    user: "568:568"
    # noeviction because the apps' Celery queues live here and must never be evicted.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--aclfile", "/data/users.acl"]
    volumes:
      - ../data/data-redis:/data
    env_file: ../.envs/.data-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user platform --pass \"$$REDIS_ADMIN_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 320m

  data-backup:
    image: postgres:16
    user: "568:568"
    env_file: ../.envs/.data-postgres
    environment:
      PGHOST: data-postgres
      BACKUP_AT: "${BACKUP_AT:-03:30}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
      BACKUP_DATABASES: "games pinguei financas"
      TZ: America/Sao_Paulo
    entrypoint: ["sh", "/usr/local/bin/pg-backup.sh"]
    volumes:
      - ./backup/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - /mnt/svd/games/backups:/backups/games
      - /mnt/svd/pinguei/backups:/backups/pinguei
      - /mnt/svd/financas/backups:/backups/financas
    depends_on:
      data-postgres:
        condition: service_healthy
    networks: [data]
    restart: unless-stopped
    logging: *logging

networks:
  platform:
    internal: true
  data:
    name: platform-data
    internal: true
  egress: {}
