[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-deployer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "PyJWT[crypto]==2.9.0",
  "httpx==0.27.2",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools]
packages = ["deployer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
